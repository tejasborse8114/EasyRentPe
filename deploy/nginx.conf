## Nginx reverse proxy for easyrentpe (Next.js on PM2, port 3010)
## Copy to /etc/nginx/sites-available/easyrentpe.conf on the VPS, then:
##   sudo ln -s /etc/nginx/sites-available/easyrentpe.conf /etc/nginx/sites-enabled/
##   sudo nginx -t && sudo systemctl reload nginx
## Replace easyrentpe.com with your actual domain before deploying.
## NOTE: this file already includes the HTTPS block Certbot generated, using the
## cert at /etc/letsencrypt/live/easyrentpe.com/. Re-deploying (cp) this file will
## NOT drop HTTPS. If you ever reissue under a different --cert-name, update the
## ssl_certificate paths below to match.

server {
    listen 80;
    server_name easyrentpe.com www.easyrentpe.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name easyrentpe.com www.easyrentpe.com;

    ssl_certificate /etc/letsencrypt/live/easyrentpe.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/easyrentpe.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
